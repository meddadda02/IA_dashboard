<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <i class="bi bi-graph-up-arrow me-2"></i>IA Dashboard
        </a>
        <div class="d-flex align-items-center gap-3">
            <a routerLink="/profile" class="btn btn-outline-primary rounded-pill btn-sm">
                <i class="bi bi-person-fill me-1"></i>Profile
            </a>
            <a routerLink="/admin" class="btn btn-outline-secondary rounded-pill btn-sm" *ngIf="isAdmin">
                <i class="bi bi-shield-lock-fill me-1"></i>Admin
            </a>
            <button class="btn-logout" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Déconnexion
            </button>
        </div>
    </div>
</nav>

<div class="container fade-in" style="margin-top: 80px;">
    <!-- Upload Section -->
    <div class="row justify-content-center" *ngIf="!analysisResult">
        <div class="col-lg-10">
            <div class="upload-card">
                <div class="upload-body">
                    <h1 class="upload-title">Analysez vos Données</h1>
                    <p class="upload-subtitle">Transformez vos fichiers CSV, Excel ou JSON en insights exploitables
                        grâce à notre IA avancée.</p>

                    <div class="file-upload-wrapper" (click)="fileInput.click()">
                        <input #fileInput type="file" (change)="onFileSelected($event)" accept=".csv,.xlsx,.xls,.json"
                            style="display: none;">
                        <i class="bi bi-cloud-arrow-up-fill upload-icon"></i>
                        <div class="upload-text">
                            <span *ngIf="!selectedFile">Glissez-déposez ou cliquez pour parcourir</span>
                            <span *ngIf="selectedFile" class="text-primary">{{ selectedFile.name }}</span>
                        </div>
                    </div>

                    <div class="actions-row">
                        <button class="btn-analyze" (click)="onUpload()" [disabled]="!selectedFile || loading">
                            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                            {{ loading ? 'Analyse en cours...' : 'Lancer l\'Analyse' }}
                        </button>
                    </div>

                    <div *ngIf="error" class="alert alert-danger mt-4 rounded-4 border-0 shadow-sm">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Analysis Results -->
    <div *ngIf="analysisResult" class="fade-in">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark mb-0">Résultats de l'Analyse</h2>
            <button class="btn-refresh" (click)="analysisResult = null">
                <i class="bi bi-arrow-counterclockwise me-2"></i>Nouvelle Analyse
            </button>
        </div>

        <app-analysis [data]="analysisResult"></app-analysis>
    </div>
</div>
