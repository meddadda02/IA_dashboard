<div class="login-container">
  <div class="login-card">
    <div class="card-header-custom">
      <div class="brand-icon">
        <i class="bi bi-graph-up-arrow"></i>
      </div>
      <h3 class="login-title">IA Dashboard</h3>
      <p class="login-subtitle">Connectez-vous pour accéder à vos analyses</p>
    </div>

    <div class="card-body-custom">
      <div *ngIf="error" class="alert alert-custom d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <div>{{ error }}</div>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="username" placeholder="Nom d'utilisateur" [(ngModel)]="username"
            name="username" required>
          <label for="username"><i class="bi bi-person me-2"></i>Nom d'utilisateur</label>
        </div>

        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="password" placeholder="Mot de passe" [(ngModel)]="password"
            name="password" required>
          <label for="password"><i class="bi bi-lock me-2"></i>Mot de passe</label>
        </div>

        <div class="d-grid mb-4">
          <button type="submit" class="btn btn-primary btn-login text-white" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            {{ loading ? 'Connexion en cours...' : 'Se connecter' }}
          </button>
        </div>

        <div class="text-center">
          <span class="text-muted">Pas encore de compte ?</span>
          <a routerLink="/register" class="text-decoration-none ms-2 fw-bold">S'inscrire</a>
        </div>
      </form>
    </div>
  </div>
</div>
